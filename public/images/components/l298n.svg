<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Red PCB Board -->
  <rect x="25" y="25" width="150" height="150" rx="8" fill="#991b1b" stroke="#a855f7" stroke-width="2"/>
  <rect x="30" y="30" width="140" height="140" rx="6" fill="#b91c1c"/>

  <!-- Mounting Holes with Copper Pads -->
  <circle cx="42" cy="42" r="7" fill="#f59e0b"/>
  <circle cx="42" cy="42" r="4.5" fill="#18181b"/>
  <circle cx="158" cy="42" r="7" fill="#f59e0b"/>
  <circle cx="158" cy="42" r="4.5" fill="#18181b"/>
  <circle cx="42" cy="158" r="7" fill="#f59e0b"/>
  <circle cx="42" cy="158" r="4.5" fill="#18181b"/>
  <circle cx="158" cy="158" r="7" fill="#f59e0b"/>
  <circle cx="158" cy="158" r="4.5" fill="#18181b"/>

  <!-- Iconic Black/Blue Aluminum Fin Heatsink (Center) -->
  <rect x="62" y="46" width="76" height="66" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
  <!-- Heatsink Vertical Cooling Fins -->
  <g fill="#0284c7">
    <rect x="68" y="52" width="6" height="54" rx="2"/>
    <rect x="78" y="52" width="6" height="54" rx="2"/>
    <rect x="88" y="52" width="6" height="54" rx="2"/>
    <rect x="98" y="52" width="6" height="54" rx="2"/>
    <rect x="108" y="52" width="6" height="54" rx="2"/>
    <rect x="118" y="52" width="6" height="54" rx="2"/>
    <rect x="126" y="52" width="6" height="54" rx="2"/>
  </g>

  <!-- L298N Multiwatt-15 IC clamped to heatsink back -->
  <rect x="76" y="40" width="48" height="12" rx="2" fill="#0f172a" stroke="#475569"/>
  <text x="100" y="48" font-family="monospace" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">L298N</text>

  <!-- Blue Screw Terminal Blocks -->
  <!-- Left Motor Terminal (OUT1, OUT2) -->
  <rect x="24" y="80" width="16" height="40" rx="3" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="32" cy="90" r="4" fill="#93c5fd"/>
  <circle cx="32" cy="90" r="1.5" fill="#1e3a8a"/>
  <circle cx="32" cy="110" r="4" fill="#93c5fd"/>
  <circle cx="32" cy="110" r="1.5" fill="#1e3a8a"/>

  <!-- Right Motor Terminal (OUT3, OUT4) -->
  <rect x="160" y="80" width="16" height="40" rx="3" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="168" cy="90" r="4" fill="#93c5fd"/>
  <circle cx="168" cy="90" r="1.5" fill="#1e3a8a"/>
  <circle cx="168" cy="110" r="4" fill="#93c5fd"/>
  <circle cx="168" cy="110" r="1.5" fill="#1e3a8a"/>

  <!-- Bottom Power Terminal Block (VMS, GND, 5V) -->
  <rect x="58" y="148" width="54" height="22" rx="3" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="68" cy="159" r="4" fill="#93c5fd"/>
  <circle cx="68" cy="159" r="1.5" fill="#1e3a8a"/>
  <circle cx="85" cy="159" r="4" fill="#93c5fd"/>
  <circle cx="85" cy="159" r="1.5" fill="#1e3a8a"/>
  <circle cx="102" cy="159" r="4" fill="#93c5fd"/>
  <circle cx="102" cy="159" r="1.5" fill="#1e3a8a"/>

  <!-- Logic Input Pins Header (IN1..IN4, ENA, ENB) -->
  <rect x="122" y="152" width="40" height="14" rx="2" fill="#0f172a"/>
  <g fill="#f59e0b">
    <circle cx="128" cy="159" r="2"/>
    <circle cx="134" cy="159" r="2"/>
    <circle cx="140" cy="159" r="2"/>
    <circle cx="146" cy="159" r="2"/>
    <circle cx="152" cy="159" r="2"/>
    <circle cx="158" cy="159" r="2"/>
  </g>

  <!-- Electrolytic Capacitors (Black Cylinders with Silver top) -->
  <circle cx="48" cy="62" r="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <circle cx="48" cy="62" r="8" fill="#64748b"/>
  <path d="M43 62H53M48 57V67" stroke="#cbd5e1" stroke-width="1.5"/>

  <circle cx="48" cy="138" r="9" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <circle cx="48" cy="138" r="7" fill="#64748b"/>
  <path d="M44 138H52M48 134V142" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 78M05 5V Linear Voltage Regulator -->
  <rect x="74" y="122" width="22" height="16" rx="2" fill="#0f172a"/>
  <rect x="78" y="118" width="14" height="4" fill="#cbd5e1"/>
  <text x="85" y="133" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">78M05</text>
</svg>
